<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>インカメラ自動撮影</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    video, canvas {
      width: 100%;
      max-width: 400px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 10px;
    }
    .status {
      margin-top: 10px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <h2>インカメラ自動撮影</h2>
  <div id="status" class="status">カメラの許可を待っています...</div>
  
  <!-- プレビュー表示（非表示にしたい場合は style="display:none;" を指定） -->
  <video id="video" autoplay playsinline></video>
  
  <!-- 撮影結果の表示領域 -->
  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status');
    const context = canvas.getContext('2d');

    // キャプチャ処理の共通化
    function captureImage() {
      if (video.videoWidth > 0 && video.videoHeight > 0) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        statusText.textContent = '自動撮影が完了しました。';
      }
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        video.srcObject = stream;

        // メタデータが読み込まれ、映像サイズが確定したら撮影実行
        video.addEventListener('loadedmetadata', () => {
          // 映像が確実に描画されるよう僅かな遅延（500ms）を挟んでキャプチャ
          setTimeout(captureImage, 500);
        });

      } catch (err) {
        statusText.textContent = 'カメラのアクセス許可が得られませんでした。';
        console.error('カメラエラー:', err);
      }
    }

    // 初期化実行
    initCamera();
  </script>

</body>
</html>
